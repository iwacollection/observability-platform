apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tempo-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: grafana/tempo:3.0.3
          imagePullPolicy: IfNotPresent
          args:
            - -target=all
            - -config.file=/etc/tempo/tempo.yaml
            - -config.expand-env=true
          env:
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingest-auth
                  key: token
            - name: INGEST_AUTHORIZATION
              value: "Bearer $(INGEST_TOKEN)"
          ports:
            - name: backend
              containerPort: 13200
            - name: backend-grpc
              containerPort: 14317
            - name: backend-otlp-http
              containerPort: 14318
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/tempo/tempo.yaml
              subPath: tempo.yaml
            - name: data
              mountPath: /var/tempo
            - name: tmp
              mountPath: /tmp
        - name: ingest-gateway
          image: nginx:1.28.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/etc/ingest-gateway/entrypoint.sh"]
          env:
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingest-auth
                  key: token
            - name: GATEWAY_MODE
              value: tempo
            - name: HTTP_LISTEN
              value: "3200"
            - name: HTTP_UPSTREAM
              value: 127.0.0.1:13200
            - name: GRPC_LISTEN
              value: "4317"
            - name: GRPC_UPSTREAM
              value: 127.0.0.1:14317
            - name: OTLP_HTTP_LISTEN
              value: "4318"
            - name: OTLP_HTTP_UPSTREAM
              value: 127.0.0.1:14318
          ports:
            - name: http
              containerPort: 3200
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          livenessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: ingest-gateway
              mountPath: /etc/ingest-gateway
              readOnly: true
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: tempo-config
        - name: data
          persistentVolumeClaim:
            claimName: tempo-data
        - name: tmp
          emptyDir: {}
        - name: ingest-gateway
          configMap:
            name: ingest-gateway-config
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
spec:
  selector:
    app.kubernetes.io/name: tempo
  ports:
    - name: http
      port: 3200
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
