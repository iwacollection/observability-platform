# SLO recording rules for the demo HTTP server and any service that emits
# http.server.request.duration via OTLP. The collector's prometheusremotewrite
# exporter names that histogram http_server_request_duration_seconds.
# /healthz is excluded so probes do not dilute the error budget.
# Aggregations keep the cluster label when the source series has it, so two
# workload clusters are not added together. Series that do not have the label
# still match the unit tests. Do not add pod uid or user id to these by() lists.
groups:
  - name: slo-recording
    interval: 30s
    rules:
      - record: slo:http_requests:rate5m
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[5m])
          )

      - record: slo:http_errors:ratio_rate5m
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz",http_response_status_code=~"5.."}[5m])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[5m])
          )

      - record: slo:http_errors:ratio_rate30m
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz",http_response_status_code=~"5.."}[30m])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[30m])
          )

      - record: slo:http_errors:ratio_rate1h
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz",http_response_status_code=~"5.."}[1h])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[1h])
          )

      - record: slo:http_errors:ratio_rate6h
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz",http_response_status_code=~"5.."}[6h])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[6h])
          )

      - record: slo:http_errors:ratio_rate1d
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz",http_response_status_code=~"5.."}[1d])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[1d])
          )

      - record: slo:http_errors:ratio_rate3d
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz",http_response_status_code=~"5.."}[3d])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[3d])
          )

      # Fraction of requests at or under the 300ms latency objective.
      - record: slo:http_latency_good:ratio_rate5m
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_bucket{http_route!="/healthz",le="0.3"}[5m])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[5m])
          )

      - record: slo:http_latency_good:ratio_rate1h
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_bucket{http_route!="/healthz",le="0.3"}[1h])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[1h])
          )

      - record: slo:http_latency_good:ratio_rate6h
        expr: |
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_bucket{http_route!="/healthz",le="0.3"}[6h])
          )
          /
          sum by (cluster, service_name) (
            rate(http_server_request_duration_seconds_count{http_route!="/healthz"}[6h])
          )

  - name: infrastructure-recording
    interval: 30s
    rules:
      - record: instance:node_cpu_utilization:ratio
        expr: |
          1 - avg by (cluster, instance) (rate(node_cpu_seconds_total{job="node",mode="idle"}[5m]))

      - record: instance:node_memory_utilization:ratio
        expr: |
          1 - (
            node_memory_MemAvailable_bytes{job="node"}
            /
            node_memory_MemTotal_bytes{job="node"}
          )

      - record: instance:node_filesystem_free:ratio
        expr: |
          node_filesystem_avail_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs|aufs|nsfs"}
          /
          node_filesystem_size_bytes{job="node",fstype!~"tmpfs|overlay|squashfs|ramfs|aufs|nsfs"}

  - name: middleware-recording
    interval: 30s
    rules:
      - record: redis:memory_utilization:ratio
        expr: |
          redis_memory_used_bytes
          /
          clamp_min(redis_memory_max_bytes, 1)

      - record: redis:commands:rate5m
        expr: sum by (cluster, instance) (rate(redis_commands_processed_total[5m]))

      - record: postgres:connections:ratio
        expr: |
          sum by (cluster) (pg_stat_database_numbackends)
          /
          clamp_min(max by (cluster) (pg_settings_max_connections), 1)

      - record: nginx:requests:rate5m
        expr: sum by (cluster) (rate(nginx_http_requests_total[5m]))

      - record: kafka:consumergroup_lag:sum
        expr: sum by (cluster, consumergroup, topic) (kafka_consumergroup_lag)

  - name: application-recording
    interval: 30s
    rules:
      - record: service:http_inflight:sum
        expr: sum by (cluster, service_name) (http_server_active_requests)

      - record: service:process_cpu_utilization:ratio
        expr: max by (service_name) (process_runtime_cpython_cpu_utilization_ratio)

  - name: business-recording
    interval: 30s
    rules:
      - record: business:orders:created:rate5m
        expr: |
          sum by (cluster, service_name, channel) (
            rate(business_orders_created_total[5m])
          )

      - record: business:payments:success_ratio5m
        expr: |
          sum by (cluster, service_name) (rate(business_payments_total{result="success"}[5m]))
          /
          sum by (cluster, service_name) (rate(business_payments_total[5m]))

      - record: business:payments:failure_ratio5m
        expr: |
          sum by (cluster, service_name) (rate(business_payments_total{result="failure"}[5m]))
          /
          sum by (cluster, service_name) (rate(business_payments_total[5m]))

      - record: business:payments:failure_ratio1h
        expr: |
          sum by (cluster, service_name) (rate(business_payments_total{result="failure"}[1h]))
          /
          sum by (cluster, service_name) (rate(business_payments_total[1h]))

      - record: business:checkout_duration:p95_5m
        expr: |
          histogram_quantile(
            0.95,
            sum by (cluster, service_name, le) (
              rate(business_checkout_duration_seconds_bucket[5m])
            )
          )

  - name: meta-recording
    interval: 30s
    rules:
      - record: platform:prometheus_head_series
        expr: prometheus_tsdb_head_series

      - record: platform:prometheus_series_created:rate10m
        expr: sum by (cluster) (rate(prometheus_tsdb_head_series_created_total[10m]))

      - record: platform:collector_queue_utilization:ratio
        expr: |
          sum by (cluster, exporter) (otelcol_exporter_queue_size)
          /
          clamp_min(sum by (cluster, exporter) (otelcol_exporter_queue_capacity), 1)

      - record: platform:loki_discarded_samples:rate5m
        expr: sum by (cluster, reason) (rate(loki_discarded_samples_total[5m]))

      - record: platform:tempo_discarded_spans:rate5m
        expr: sum by (cluster, reason) (rate(tempo_discarded_spans_total[5m]))
