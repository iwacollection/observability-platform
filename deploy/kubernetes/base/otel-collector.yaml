apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args:
            - --config=/etc/otelcol-contrib/config.yaml
            - --feature-gates=service.profilesSupport
          env:
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: CLUSTER_NAME
            - name: PROMETHEUS_REMOTE_WRITE_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: PROMETHEUS_REMOTE_WRITE_URL
            - name: LOKI_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: LOKI_OTLP_ENDPOINT
            - name: TEMPO_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: TEMPO_OTLP_ENDPOINT
            - name: PYROSCOPE_OTLP_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: PYROSCOPE_OTLP_ENDPOINT
            # "true" only for this repo's plaintext central stack. Attach
            # writes "false" unless exporter_tls_insecure is set.
            - name: OTEL_EXPORTER_TLS_INSECURE
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: OTEL_EXPORTER_TLS_INSECURE
            - name: OTEL_EXPORTER_TLS_CA_FILE
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: OTEL_EXPORTER_TLS_CA_FILE
                  optional: true
            # Optional. The central ConfigMap omits these keys. A workload
            # ConfigMap sets them, empty on the platform path and filled in
            # by stacks/attach-existing.
            - name: TENANT
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: TENANT
                  optional: true
            - name: BUSINESS_LINE
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: BUSINESS_LINE
                  optional: true
            - name: ORG_ID
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: ORG_ID
                  optional: true
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingest-auth
                  key: token
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: health
              containerPort: 13133
            - name: zpages
              containerPort: 55679
          readinessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib/config.yaml
              subPath: config.yaml
            - name: exporter-tls-ca
              mountPath: /etc/otel-exporter-tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        # Optional. Created only when a CA PEM is supplied out of band.
        # The manifest does not contain a certificate.
        - name: exporter-tls-ca
          secret:
            secretName: otel-exporter-tls-ca
            optional: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/name: otel-collector
spec:
  selector:
    app.kubernetes.io/name: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: health
      port: 13133
      targetPort: health
    - name: zpages
      port: 55679
      targetPort: zpages
