# Reverse proxy in front of demo-app. stub_status is the metric source
# for nginx-prometheus-exporter. It exposes request rate and connection
# counts, not HTTP status codes. Error ratio for the app stays on the
# OpenTelemetry RED metrics.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 256;
}

http {
    access_log /tmp/nginx-access.log;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;

        location /stub_status {
            stub_status;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        location / {
            proxy_pass http://demo-app:8080;
            proxy_set_header Host $host;
        }
    }
}
