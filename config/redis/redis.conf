# Local Redis used as a middleware monitoring target.
# maxmemory is set so redis_memory_max_bytes is non-zero and
# RedisMemorySaturation can be evaluated. Do not put key names,
# user ids, or session tokens into metric labels.
bind 0.0.0.0
protected-mode no
port 6379
maxmemory 64mb
maxmemory-policy allkeys-lru
appendonly no
save ""
