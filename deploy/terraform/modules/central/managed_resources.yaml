    - {kind: Service, name: pyroscope, kustomize: [dev, prod], terraform: ""}
    - {kind: PersistentVolumeClaim, name: pyroscope-data, kustomize: [dev, prod], terraform: ""}
    - {kind: ConfigMap, name: pyroscope-config, kustomize: [dev, prod], terraform: ""}
  grafana:
    - {kind: Deployment, name: grafana, kustomize: [dev, prod], terraform: ""}
    - {kind: Service, name: grafana, kustomize: [dev, prod], terraform: ""}
    - {kind: PersistentVolumeClaim, name: grafana-data, kustomize: [dev, prod], terraform: ""}
    - {kind: ConfigMap, name: grafana-datasources, kustomize: [dev, prod], terraform: ""}
