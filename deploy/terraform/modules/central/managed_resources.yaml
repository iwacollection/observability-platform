# Objects module.central installs on the central cluster.
# kustomize lists overlays whose `kustomize build` must contain the object.
# ConfigMap names are generator names; Kustomize appends a hash.
# terraform: prod | optional | ""  — prod Secret ingest-auth is kubernetes_secret_v1.
# The coverage check fails if a rendered kind/name is not listed here.
required_components:
  - namespace
  - prometheus
  - alertmanager
  - loki
  - tempo
  - pyroscope
  - grafana
  - dashboards
  - rules
  - ingest-gateway
  - otel-collector
  - alloy
  - node-exporter
  - kube-state-metrics
  - middleware
  - workloads
  - endpoints
  - tenancy
  - networkpolicy
  - secrets
generated_workloads:
  # Names come from config/tenancy.yaml. toc-api is Deployment demo-app below.
  kustomize:
    - dev
    - prod
  kinds:
    - Deployment
    - Service
components:
  namespace:
    - {kind: Namespace, name: observability, kustomize: [dev, prod], terraform: ""}
  prometheus:
    - {kind: Deployment, name: prometheus, kustomize: [dev, prod], terraform: ""}
    - {kind: Service, name: prometheus, kustomize: [dev, prod], terraform: ""}
    - {kind: PersistentVolumeClaim, name: prometheus-data, kustomize: [dev, prod], terraform: ""}
    - {kind: ConfigMap, name: prometheus-config, kustomize: [dev, prod], terraform: ""}
  alertmanager:
    - {kind: Deployment, name: alertmanager, kustomize: [dev, prod], terraform: ""}
    - {kind: Service, name: alertmanager, kustomize: [dev, prod], terraform: ""}
    - {kind: PersistentVolumeClaim, name: alertmanager-data, kustomize: [dev, prod], terraform: ""}
    - {kind: ConfigMap, name: alertmanager-config, kustomize: [dev, prod], terraform: ""}
  loki:
    - {kind: Deployment, name: loki, kustomize: [dev, prod], terraform: ""}
    - {kind: Service, name: loki, kustomize: [dev, prod], terraform: ""}
    - {kind: PersistentVolumeClaim, name: loki-data, kustomize: [dev, prod], terraform: ""}
    - {kind: ConfigMap, name: loki-config, kustomize: [dev, prod], terraform: ""}
  tempo:
    - {kind: Deployment, name: tempo, kustomize: [dev, prod], terraform: ""}
    - {kind: Service, name: tempo, kustomize: [dev, prod], terraform: ""}
    - {kind: PersistentVolumeClaim, name: tempo-data, kustomize: [dev, prod], terraform: ""}
    - {kind: ConfigMap, name: tempo-config, kustomize: [dev, prod], terraform: ""}
  pyroscope:
