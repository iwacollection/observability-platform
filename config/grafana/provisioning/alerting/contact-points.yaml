apiVersion: 1

# Paging is intentionally unconfigured.
# ALERT_WEBHOOK_URL and TF_VAR_alert_webhook_url are unset in this committed file.
# This contact point has no receivers, so Grafana keeps alerts in the UI and
# does not POST them. config/grafana/provisioning/alerting/render-alerting.sh
# adds a webhook receiver for critical and warning when the variable is set.
# Do not commit a URL or a token.
contactPoints:
  - orgId: 1
    name: unconfigured
    receivers: []
