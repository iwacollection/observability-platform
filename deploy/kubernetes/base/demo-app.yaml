apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-app
        observability.platform/business-line: toc
        observability.platform/tenant: consumer
        observability.platform/org-id: toc
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-app
          image: demo-app:local
          imagePullPolicy: IfNotPresent
          env:
            - name: OTEL_SERVICE_NAME
              value: toc-api
            - name: BUSINESS_LINE
              value: toc
            - name: TENANT_ID
              value: consumer
            - name: SERVICE_ROLE
              value: api
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: PYROSCOPE_HTTP_URL
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: PYROSCOPE_HTTP_URL
            - name: DEPLOYMENT_ENVIRONMENT
              value: dev
            - name: CLUSTER_NAME
              valueFrom:
                configMapKeyRef:
                  name: observability-endpoints
                  key: CLUSTER_NAME
            - name: DEMO_LISTEN_ADDR
              value: 0.0.0.0:8080
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            - name: OTEL_METRICS_EXEMPLAR_FILTER
              value: trace_based
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ingest-auth
                  key: token
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-app
  labels:
    app.kubernetes.io/name: demo-app
spec:
  selector:
    app.kubernetes.io/name: demo-app
  ports:
    - name: http
      port: 8080
      targetPort: http
