# Local observability stack. Published ports bind to 127.0.0.1 only.
# Config files are the same ones Kubernetes mounts via Kustomize.
# Grafana's default password is admin unless GF_SECURITY_ADMIN_PASSWORD is set.
# That default is acceptable only on localhost.

name: observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --feature-gates=service.profilesSupport
    environment:
      CLUSTER_NAME: local
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      # Explicit plaintext flag for this local stack. attach-existing defaults
      # the same variable to false so an existing HTTPS ingest works.
      OTEL_EXPORTER_TLS_INSECURE: "true"
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      LOKI_OTLP_ENDPOINT: http://loki:3100/otlp
      TEMPO_OTLP_ENDPOINT: tempo:4317
      PYROSCOPE_OTLP_ENDPOINT: pyroscope:4040
    volumes:
      - ../../config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8888:8888"
      - "127.0.0.1:13133:13133"
      - "127.0.0.1:55679:55679"
    mem_limit: 512m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=generally-available
    environment:
      CLUSTER_NAME: local
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      PROMETHEUS_REMOTE_WRITE_URL: http://prometheus:9090/api/v1/write
      LOKI_PUSH_URL: http://loki:3100/loki/api/v1/push
    volumes:
      - ../../config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:12345:12345"
    mem_limit: 256m
    restart: unless-stopped

  # DNS name stays prometheus. The process is prometheus-store, loopback only.
  # INGEST_TOKEN default is the local placeholder, not a production credential.
  prometheus:
    image: nginx:1.28.0
    entrypoint: ["/bin/sh", "/etc/ingest-gateway/entrypoint.sh"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      GATEWAY_MODE: http
      HTTP_LISTEN: "9090"
      HTTP_UPSTREAM: 127.0.0.1:19090
    volumes:
      - ../../config/ingest-gateway:/etc/ingest-gateway:ro
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 64m
    restart: unless-stopped

  prometheus-store:
    image: prom/prometheus:v3.15.0
    network_mode: service:prometheus
    depends_on:
      prometheus:
        condition: service_started
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.listen-address=127.0.0.1:19090
      - --enable-feature=exemplar-storage
    volumes:
      - ../../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:19090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ../../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped

  loki:
    image: nginx:1.28.0
    entrypoint: ["/bin/sh", "/etc/ingest-gateway/entrypoint.sh"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      GATEWAY_MODE: http
      HTTP_LISTEN: "3100"
      HTTP_UPSTREAM: 127.0.0.1:13100
    volumes:
      - ../../config/ingest-gateway:/etc/ingest-gateway:ro
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 64m
    restart: unless-stopped

  loki-store:
    image: grafana/loki:3.7.8
    network_mode: service:loki
    depends_on:
      loki:
        condition: service_started
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ../../config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    mem_limit: 1g
    restart: unless-stopped

  tempo:
    image: nginx:1.28.0
    entrypoint: ["/bin/sh", "/etc/ingest-gateway/entrypoint.sh"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      GATEWAY_MODE: tempo
      HTTP_LISTEN: "3200"
      HTTP_UPSTREAM: 127.0.0.1:13200
      GRPC_LISTEN: "4317"
      GRPC_UPSTREAM: 127.0.0.1:14317
      OTLP_HTTP_LISTEN: "4318"
      OTLP_HTTP_UPSTREAM: 127.0.0.1:14318
    volumes:
      - ../../config/ingest-gateway:/etc/ingest-gateway:ro
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 64m
    restart: unless-stopped

  tempo-store:
    image: grafana/tempo:3.0.3
    network_mode: service:tempo
    depends_on:
      tempo:
        condition: service_started
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yaml
      - -config.expand-env=true
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      INGEST_AUTHORIZATION: ${INGEST_AUTHORIZATION:-Bearer dev-ingest-token}
    volumes:
      - ../../config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    mem_limit: 1g
    restart: unless-stopped

  pyroscope:
    image: nginx:1.28.0
    entrypoint: ["/bin/sh", "/etc/ingest-gateway/entrypoint.sh"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      GATEWAY_MODE: pyroscope
      HTTP_LISTEN: "4040"
      HTTP_UPSTREAM: 127.0.0.1:14040
    volumes:
      - ../../config/ingest-gateway:/etc/ingest-gateway:ro
    ports:
      - "127.0.0.1:4040:4040"
    mem_limit: 64m
    restart: unless-stopped

  pyroscope-store:
    image: grafana/pyroscope:2.3.1
    network_mode: service:pyroscope
    depends_on:
      pyroscope:
        condition: service_started
    command:
      - -config.file=/etc/pyroscope/config.yaml
      - -target=all
    volumes:
      - ../../config/pyroscope/config.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope-data:/data
    mem_limit: 1g
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles tracesEmbeddedFlameGraph
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      INGEST_AUTHORIZATION: ${INGEST_AUTHORIZATION:-Bearer dev-ingest-token}
    volumes:
      - ../../config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../config/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../../config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    restart: unless-stopped

  demo-app:
    build:
      context: ../../examples/demo-app
    image: demo-app:local
    environment:
      OTEL_SERVICE_NAME: toc-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PYROSCOPE_HTTP_URL: http://pyroscope:4040
      INGEST_TOKEN: ${INGEST_TOKEN:-dev-ingest-token}
      DEPLOYMENT_ENVIRONMENT: local
      CLUSTER_NAME: local
      BUSINESS_LINE: toc
      TENANT_ID: consumer
      SERVICE_ROLE: api
      DEMO_LISTEN_ADDR: 0.0.0.0:8080
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
      OTEL_METRICS_EXEMPLAR_FILTER: trace_based
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped

  # Kubernetes-only image pin (needs an API server; no Compose service):
  # registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.16.0

  node-exporter:
    image: prom/node-exporter:v1.9.1
    user: root
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --web.listen-address=0.0.0.0:9100
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:9100:9100"
    mem_limit: 128m
    restart: unless-stopped

  redis:
    image: redis:7.4.6
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ../../config/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 128m
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    environment:
      REDIS_ADDR: redis://redis:6379
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis
    mem_limit: 64m
    restart: unless-stopped

  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    mem_limit: 256m
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres@postgres:5432/postgres?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - postgres
    mem_limit: 64m
    restart: unless-stopped

  nginx:
    image: nginx:1.28.0
    volumes:
      - ../../config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      - demo-app
    mem_limit: 64m
    restart: unless-stopped

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.2
    command:
      - --nginx.scrape-uri=http://nginx:8080/stub_status
    ports:
      - "127.0.0.1:9113:9113"
    depends_on:
      - nginx
    mem_limit: 64m
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "3"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:9092:9092"
    mem_limit: 768m
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.9.0
    command:
      - --kafka.server=kafka:9092
    ports:
      - "127.0.0.1:9308:9308"
    depends_on:
      - kafka
    mem_limit: 128m
    restart: unless-stopped

volumes:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  pyroscope-data:
  grafana-data:
  postgres-data:
