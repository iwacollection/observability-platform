# Template for Secret ingest-auth. This file is not part of a kustomization.
# Copy it, replace the token, and apply it in the observability namespace.
# Do not commit the copy.
#
# The dev overlay ships a different Secret whose token is the local
# placeholder dev-ingest-token. That value is not a production credential.
apiVersion: v1
kind: Secret
metadata:
  name: ingest-auth
  namespace: observability
type: Opaque
stringData:
  token: replace-me
