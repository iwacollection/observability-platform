# Monolithic Tempo (-target=all). Local block storage under /var/tempo.
# The OTLP receivers listen on 0.0.0.0 so the same file works in Compose
# (hostname tempo) and in Kubernetes (pod hostname is not the Service name).
# Distributed Tempo (distributors, ingesters, object storage) belongs on the
# upstream Tempo Helm chart; do not scale this file past one replica.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: observability
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Tempo 3 moved block retention under backend_worker.compaction.block_retention.
# The default is 14 days. Setting the block here also requires a backend
# scheduler address, which the single-binary local topology does not run.
# Leave the default in place until you move to the distributed Helm chart.

overrides:
  defaults:
    metrics_generator:
      processors: ["span-metrics", "service-graphs"]
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
