# Shape of Secret ingest-auth. This file is not part of a kustomization
# and is not applied by Terraform or by the install path.
#
# Prod: export TF_VAR_ingest_token and run terraform apply. The Kubernetes
# provider creates this Secret in namespace observability. Do not commit the
# token. Do not kubectl-apply a filled-in copy as the way to install.
#
# Dev: overlays/dev already ships a local placeholder in its own Secret.
# That placeholder is not a production credential.
apiVersion: v1
kind: Secret
metadata:
  name: ingest-auth
  namespace: observability
type: Opaque
stringData:
  token: replace-me
