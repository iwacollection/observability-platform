# Single-binary Loki for local and small clusters.
# Scalable mode (read/write/backend, object storage, memberlist) is a different
# topology. Use the Grafana Loki Helm chart for that and keep this file as the
# schema/limits reference. Do not point a multi-replica deployment at this file:
# the filesystem store and in-memory ring are single-process.

# Multi-tenant. Every push and query must send X-Scope-OrgID.
# Org ids come from config/tenancy.yaml (toc, tob-acme, tob-northwind,
# platform, rejected). /metrics and /ready stay unauthenticated.
auth_enabled: true

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  grpc_server_max_concurrent_streams: 1000

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: 2024-04-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h
  max_query_lookback: 168h
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  # Per-tenant stream cap. 0 on max_streams_per_user means "no per-ingester
  # cap"; max_global_streams_per_user is the cluster-wide cap this binary
  # enforces. Raise it only after LokiStreamChurn stays quiet.
  max_streams_per_user: 0
  max_global_streams_per_user: 10000
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_label_names_per_series: 15
  max_label_name_length: 1024
  max_label_value_length: 2048
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true
  allow_structured_metadata: true
  discover_log_levels: true
  metric_aggregation_enabled: true
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service.name
            - service.namespace
            - service.instance.id
            - deployment.environment
            - deployment.environment.name
            # One value per cluster. Do not index pod uid, user id, or trace id.
            - cluster
            - tenant
            - business_line

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

pattern_ingester:
  enabled: true
  metric_aggregation:
    loki_address: 127.0.0.1:3100

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false
