# Scrapes platform self-metrics. Application RED metrics arrive via remote write
# from the OpenTelemetry Collector, not from a direct demo-app scrape.
# Host/container metrics arrive via remote write from Grafana Alloy.
# Service DNS names match both Compose service names and Kubernetes Services.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  # Prometheus 3.9+ ingests native histograms only when this is set.
  # Classic histograms are still scraped so existing rules keep working.
  scrape_native_histograms: true
  always_scrape_classic_histograms: true
  external_labels:
    cluster: observability

storage:
  exemplars:
    max_exemplars: 100000

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]

  - job_name: pyroscope
    static_configs:
      - targets: ["pyroscope:4040"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
