# Local observability stack. Published ports bind to 127.0.0.1 only.
# Config files are the same ones Kubernetes mounts via Kustomize.
# Grafana's default password is admin unless GF_SECURITY_ADMIN_PASSWORD is set.
# That default is acceptable only on localhost.

name: observability

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    command:
      - --config=/etc/otelcol-contrib/config.yaml
      - --feature-gates=service.profilesSupport
    volumes:
      - ../../config/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    mem_limit: 512m
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=generally-available
    volumes:
      - ../../config/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    ports:
      - "127.0.0.1:12345:12345"
    mem_limit: 256m
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
      - --web.listen-address=0.0.0.0:9090
      - --enable-feature=exemplar-storage
    volumes:
      - ../../config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../config/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.34.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=0.0.0.0:9093
    volumes:
      - ../../config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    mem_limit: 256m
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.8
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ../../config/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 1g
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.0.3
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ../../config/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"
    mem_limit: 1g
    restart: unless-stopped

  pyroscope:
    image: grafana/pyroscope:2.3.1
    command:
      - -config.file=/etc/pyroscope/config.yaml
      - -target=all
    volumes:
      - ../../config/pyroscope/config.yaml:/etc/pyroscope/config.yaml:ro
      - pyroscope-data:/data
    ports:
      - "127.0.0.1:4040:4040"
    mem_limit: 1g
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_FEATURE_TOGGLES_ENABLE: traceToProfiles tracesEmbeddedFlameGraph
    volumes:
      - ../../config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../../config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../config/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../../config/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    restart: unless-stopped

  demo-app:
    build:
      context: ../../examples/demo-app
    image: demo-app:local
    environment:
      OTEL_SERVICE_NAME: demo-app
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      PYROSCOPE_SERVER_ADDRESS: http://pyroscope:4040
      DEPLOYMENT_ENVIRONMENT: local
      DEMO_LISTEN_ADDR: 0.0.0.0:8080
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      otel-collector:
        condition: service_started
      pyroscope:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    restart: unless-stopped

volumes:
  alloy-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  tempo-data:
  pyroscope-data:
  grafana-data:
